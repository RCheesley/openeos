# Accessibility problems that are known and not yet fixed.
#
# The accessibility check (python manage.py test accessibility) fails on any
# WCAG 2.2 A or AA violation that is not listed here, and also on any entry
# here that it no longer finds. So:
#   - when you fix one, delete its entry in the same pull request;
#   - add an entry only when the fix does not belong in your pull request, and
#     say why in the reason. Entries are reviewed like any other change.
#
# rule: the axe-core rule id (https://dequeuniversity.com/rules/axe/4.12/<rule>).
# page: the page name from the list in accessibility/test_pages.py.
# An entry covers every element that breaks that rule on that page.
#
# Baseline recorded against axe-core 4.12.1.

