# Prose linting for the documentation. See docs/contributing/style-guide.md.
#
# Run it from the repository root (docs/README.md has the Docker command):
#   vale sync    # fetch the Google package into docs/.vale/styles/Google (not committed)
#   vale --glob='!**/_build/**' docs   # skip the built copy of the site
#
# Errors fail the docs workflow. Warnings and suggestions do not.
StylesPath = docs/.vale/styles
MinAlertLevel = suggestion
Vocab = Empresadence

# Pinned to a release so every run uses the same rules.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.2/Google.zip

[formats]
# The docs are MyST Markdown. Vale reads MyST natively, so directives,
# their options, roles, heading targets and front matter are not linted as prose.
md = myst

[docs/**/*.md]
BasedOnStyles = Vale, Google, Empresadence

# Text in bold is an interface label copied from the screen, so it is not
# ours to correct.
TokenIgnores = (\*\*[^*\n]+\*\*)

# The house style is British English. Empresadence.Spelling checks every
# word against a British dictionary, and Empresadence.Americanisms catches
# '-ize' forms, which that dictionary also accepts.
Vale.Spelling = NO
Google.Spelling = NO
# Replaced by stricter or different house rules.
Google.Headings = NO
Google.EmDash = NO
Google.Latin = NO
Google.DateFormat = NO
# American punctuation and comma habits.
Google.Quotes = NO
Google.OxfordComma = NO
# These want a lower-case word after a colon and 'administrator' for
# 'Admin'. Both clash with product terms, which keep their capitals.
Google.Colons = NO
Google.WordListCase = NO
# Too noisy for short task pages.
Google.Parens = NO
Google.Contractions = NO
Google.Acronyms = NO
