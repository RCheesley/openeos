name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eos_test
          POSTGRES_USER: eos_user
          POSTGRES_PASSWORD: eos_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests with coverage
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: eos_test
          DB_USER: eos_user
          DB_PASSWORD: eos_password
          SECRET_KEY: ci-secret-key-not-used-in-production
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: |
          coverage run manage.py test apps --verbosity=2
          coverage report --fail-under=60
          coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore

  lint:
    name: System check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: eos_test
          POSTGRES_USER: eos_user
          POSTGRES_PASSWORD: eos_password
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Django system check
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: eos_test
          DB_USER: eos_user
          DB_PASSWORD: eos_password
          SECRET_KEY: ci-secret-key-not-used-in-production
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py check --deploy 2>&1 | grep -v "^System check" || true

      - name: Check for missing migrations
        env:
          DJANGO_SETTINGS_MODULE: config.settings.development
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: eos_test
          DB_USER: eos_user
          DB_PASSWORD: eos_password
          SECRET_KEY: ci-secret-key-not-used-in-production
          ALLOWED_HOSTS: localhost,127.0.0.1
        run: python manage.py makemigrations --check --dry-run
