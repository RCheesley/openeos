name: Docs

on:
  push:
    branches: [main, develop]
    paths:
      - "docs/**"
      - ".vale.ini"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".vale.ini"
      - ".readthedocs.yaml"
      - ".github/workflows/docs.yml"

permissions:
  contents: read

env:
  VALE_VERSION: "3.29.0"

jobs:
  build:
    name: Build (warnings are errors)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Build the docs
        run: sphinx-build -W --keep-going -b html docs docs/_build/html

      - name: Check images
        run: python docs/_tools/check_images.py

      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/_build/html
          if-no-files-found: error

  vale:
    name: Vale (errors fail)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Vale
        run: |
          curl -sSfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            | tar -xz -C /usr/local/bin vale
          vale --version

      # The Google package is pinned in .vale.ini and fetched here, not committed.
      - name: Fetch style packages
        run: vale sync

      # Vale exits non-zero only when it finds errors. Warnings and
      # suggestions are printed but do not fail the job.
      - name: Lint the docs
        run: vale --no-wrap --glob='!**/_build/**' docs

  linkcheck:
    name: Link check (does not block)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Check external links
        run: sphinx-build -b linkcheck docs docs/_build/linkcheck
