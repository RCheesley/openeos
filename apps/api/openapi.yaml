          - updated_at
          - -updated_at
          default: id
      - in: query
        name: status
        schema:
          type: string
          enum:
          - dropped
          - in_discussion
          - open
          - resolved
        description: Only blockers with this status.
      - in: query
        name: team
        schema:
          type: integer
        description: Only blockers raised by this team or handed to it.
      - in: query
        name: type
        schema:
          type: string
          enum:
          - long_term
          - short_term
        description: Only short-term or long-term blockers.
      - in: query
        name: updated_since
        schema:
          type: string
          format: date-time
        description: Only records changed at or after this time (ISO 8601). What a
