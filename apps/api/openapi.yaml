    Person:
      type: object
      description: A user, as far as another member of the organisation needs to know
        them.
      properties:
        id:
          type: integer
        name:
          type: string
          readOnly: true
      required:
      - id
      - name
    Priority:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
          description: What does "done" look like? Make it specific and measurable.
        status:
          $ref: '#/components/schemas/PriorityStatusEnum'
        owner:
          $ref: '#/components/schemas/Person'
        team_id:
          type: integer
        is_company_wide:
          type: boolean
        quarter:
          allOf:
          - $ref: '#/components/schemas/QuarterEnum'
          minimum: 0
          maximum: 32767
        year:
          type: integer
          maximum: 32767
          minimum: 0
        due_date:
          type: string
          format: date
        parent_id:
          type:
          - integer
          - 'null'
        created_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - due_date
      - id
      - is_company_wide
      - owner
      - parent_id
      - quarter
      - status
      - team_id
      - title
      - updated_at
      - year
    PriorityStatusEnum:
      enum:
      - on_track
      - off_track
      - complete
      - dropped
      type: string
      description: |-
        * `on_track` - On track
        * `off_track` - Off track
        * `complete` - Complete
        * `dropped` - Dropped
    Problem:
      type: object
      description: RFC 9457 problem details. Every error has this shape.
      properties:
        type:
          type: string
          default: about:blank
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        errors:
          type: object
          additionalProperties: {}
          description: Present when a parameter was not valid.
      required:
      - status
      - title
    QuarterEnum:
      enum:
      - 1
      - 2
      - 3
      - 4
      type: integer
      description: |-
        * `1` - Q1
        * `2` - Q2
        * `3` - Q3
        * `4` - Q4
    Responsibility:
      type: object
      properties:
        id:
          type: integer
        description:
          type: string
        order:
          type: integer
      required:
      - description
      - id
      - order
    RoleEnum:
      enum:
      - admin
      - leader
      - member
      type: string
      description: |-
        * `admin` - Admin
        * `leader` - Team Leader
        * `member` - Team Member
    SectionFormatEnum:
      enum:
      - text
      - single_line
      - list
      type: string
      description: |-
        * `text` - Paragraph
        * `single_line` - Single line
        * `list` - List, one item per line
    Step:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        priority_id:
          type: integer
        title:
          type: string
          maxLength: 255
        description:
          type: string
        due_date:
          type:
          - string
          - 'null'
          format: date
        is_complete:
          type: boolean
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        order:
          type: integer
          maximum: 32767
          minimum: 0
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - priority_id
      - title
    Team:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - updated_at
    Term:
      type: object
      properties:
        singular:
          type: string
        plural:
          type: string
      required:
      - plural
      - singular
    Value:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        order:
          type: integer
      required:
      - description
      - id
      - name
      - order
    VisionBoard:
      type: object
      properties:
        values:
          type: array
          items:
            $ref: '#/components/schemas/Value'
        pages:
          type: array
          items:
            $ref: '#/components/schemas/VisionPage'
          description: 'The document in the organisation''s own layout: pages, groups,
            then sections.'
      required:
      - pages
      - values
    VisionGroup:
      type: object
      properties:
        label:
          type: string
        hint:
          type: string
        sections:
          type: array
          items:
            $ref: '#/components/schemas/VisionSection'
      required:
      - hint
      - label
      - sections
    VisionPage:
      type: object
      properties:
        label:
          type: string
        groups:
          type: array
          items:
            $ref: '#/components/schemas/VisionGroup'
      required:
      - groups
      - label
    VisionSection:
      type: object
      properties:
        key:
          type: string
          description: Fixed name of the section within this organisation's document.
        label:
          type: string
          description: Empty when the group's label is label enough.
        format:
          $ref: '#/components/schemas/SectionFormatEnum'
        content:
          type: string
        last_edited_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        last_edited_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - content
      - format
      - key
      - label
      - last_edited_at
      - last_edited_by
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: /o/authorize/
          tokenUrl: /o/token/
          refreshUrl: /o/token/
          scopes:
            organisation:read: See the organisation's name, branding and vocabulary
            teams:read: See the organisation's teams
            priorities:read: See priorities, their steps and check-ins
            actions:read: See actions
            blockers:read: See blockers
            metrics-boards:read: See metrics boards, their metrics and the values
              entered for them
            meetings:read: 'See meetings: agenda, notes, updates, ratings and key
              messages'
            vision-board:read: See the organisation's vision document and its values
            org-chart:read: See the organisation's chart of roles and who holds each
              one
      oauth2MetadataUrl: /.well-known/oauth-authorization-server
tags:
- name: Organisation
  description: The organisation the token acts in, and the caller.
- name: Teams
- name: Priorities
  description: Quarterly priorities.
- name: Steps
  parent: Priorities
  description: The steps that make up a priority.
- name: Check-ins
  parent: Priorities
  description: Weekly progress notes on a priority.
- name: Actions
- name: Blockers
- name: Metrics Boards
  description: The numbers a team watches each week or month.
- name: Metrics
  parent: Metrics Boards
  description: The measures on a board, each with a goal.
- name: Entries
  parent: Metrics Boards
  description: The value entered for a metric each period.
- name: Meetings
  description: A team's regular meetings, with what was noted and agreed.
- name: Vision Board
  description: The organisation's long-term vision and plan.
- name: Org Chart
  description: Who is responsible for what.
