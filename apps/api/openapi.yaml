openapi: 3.2.0
info:
  title: Empresadence API
  version: 1.0.0
  description: 'Read access to one organisation''s teams, priorities, actions, blockers,
    metrics boards, meetings, vision document and org chart. Every request needs an
    OAuth 2.1 access token; the token fixes the organisation it acts in. Resource
    and field names are fixed whatever an organisation calls things: its own words
    are returned by `GET /api/v1/organisation`.'
paths:
  /api/v1/actions:
    get:
      operationId: actions_list
      description: Actions of the teams you may list on the web, plus any you own.
      summary: List actions
      parameters:
      - name: cursor
        required: false
        in: query
        description: Where to continue from. Follow the `next` and `previous` links;
          do not build one.
        schema:
          type: string
      - name: limit
        required: false
        in: query
        description: 'How many results to return per page: 50 unless given, 200 at
          most.'
        schema:
          type: integer
      - in: query
        name: mine
        schema:
          type: boolean
        description: '`true` for only the caller''s own actions.'
      - name: ordering
        required: false
        in: query
        description: Sort order. A leading minus means newest or highest first.
        schema:
          type: string
          enum:
          - id
          - -id
          - updated_at
          - -updated_at
          default: id
      - in: query
        name: status
        schema:
          type: string
          enum:
          - complete
          - open
        description: Only actions with this status.
      - in: query
        name: team
        schema:
          type: integer
        description: Only records of this team.
      - in: query
        name: updated_since
        schema:
          type: string
          format: date-time
        description: Only records changed at or after this time (ISO 8601). What a
          sync client polls with.
      tags:
      - Actions
      security:
      - oauth2:
        - actions:read
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActionList'
          description: ''
        '400':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: A query parameter was not valid.
        '401':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No access token, or one that is expired, revoked or issued
            for another address.
        '403':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: The token lacks the scope this endpoint needs.
        '429':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: Too many requests.
  /api/v1/actions/{id}:
    get:
      operationId: actions_retrieve
      description: Any action of the organisation, as on the web. Anything else answers
        404.
      summary: Get one action
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - Actions
      security:
      - oauth2:
        - actions:read
      responses:
        '200':
