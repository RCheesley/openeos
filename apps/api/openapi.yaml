components:
  schemas:
    Action:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/ActionStatusEnum'
        owner:
          $ref: '#/components/schemas/Person'
        team_id:
          type: integer
        due_date:
          type: string
          format: date
        completed_at:
          type:
          - string
          - 'null'
          format: date-time
        priority_id:
          type:
          - integer
          - 'null'
        blocker_id:
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blocker_id
      - created_at
      - id
      - owner
      - priority_id
      - status
      - team_id
      - title
      - updated_at
    ActionStatusEnum:
      enum:
      - open
      - complete
      type: string
      description: |-
        * `open` - Open
        * `complete` - Complete
    AgendaItem:
      type: object
      properties:
        position:
          type: integer
          description: Place in the agenda, from 0. Notes refer to it.
        type:
          $ref: '#/components/schemas/AgendaItemTypeEnum'
        name:
          type: string
          description: What the organisation calls this part of the meeting.
        duration_minutes:
          type: integer
      required:
      - duration_minutes
      - name
      - position
      - type
    AgendaItemTypeEnum:
      enum:
      - meeting_opener
      - metrics_board_review
      - priority_review
      - updates
      - action_review
      - problem_solving
      - conclude
      - custom
      type: string
      description: |-
        * `meeting_opener` - Meeting opener
        * `metrics_board_review` - Metrics board review
        * `priority_review` - Priority review
        * `updates` - Updates
        * `action_review` - Action review
        * `problem_solving` - Problem solving
        * `conclude` - Conclude
        * `custom` - Custom
    Blocker:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          maxLength: 255
        description:
          type: string
        status:
          $ref: '#/components/schemas/BlockerStatusEnum'
        type:
          $ref: '#/components/schemas/BlockerTypeEnum'
        team_id:
          type: integer
        delegated_to_team_id:
          type:
          - integer
          - 'null'
        is_company_wide:
          type: boolean
        priority_ids:
          type: array
          items:
            type: integer
          readOnly: true
        target_quarter:
          minimum: 0
          maximum: 32767
          oneOf:
          - $ref: '#/components/schemas/QuarterEnum'
          - $ref: '#/components/schemas/NullEnum'
        target_year:
          type:
          - integer
          - 'null'
          maximum: 32767
          minimum: 0
        resolution_notes:
          type: string
        created_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - delegated_to_team_id
      - id
      - is_company_wide
      - priority_ids
      - status
      - team_id
      - title
      - type
      - updated_at
    BlockerStatusEnum:
      enum:
      - open
      - in_discussion
      - resolved
      - dropped
      type: string
      description: |-
        * `open` - Open
        * `in_discussion` - Being worked through
        * `resolved` - Resolved
        * `dropped` - Dropped
    BlockerTypeEnum:
      enum:
      - short_term
      - long_term
      type: string
      description: |-
        * `short_term` - Short-term
        * `long_term` - Long-term
    Branding:
      type: object
      properties:
        display_name:
          type: string
        tagline:
          type: string
        primary_color:
          type: string
          description: 'A hex colour such as #0d6efd, or empty.'
        navbar_style:
          type: string
        logo_url:
          type: string
        favicon_url:
          type: string
      required:
      - display_name
      - favicon_url
      - logo_url
      - navbar_style
      - primary_color
      - tagline
    CheckIn:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        priority_id:
          type: integer
        confidence:
          $ref: '#/components/schemas/ConfidenceEnum'
        note:
          type: string
        created_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - confidence
      - created_at
      - created_by
      - id
      - priority_id
    ConfidenceEnum:
      enum:
      - on_track
      - off_track
      type: string
      description: |-
        * `on_track` - On track
        * `off_track` - Off track
    Entry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        metric_id:
          type: integer
        period_start:
          type: string
          format: date
          description: The first day of the week or month the value is for.
        value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        on_track:
          type: boolean
          description: Whether the value met the metric's goal when it was entered.
        note:
          type: string
        entered_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - entered_by
      - id
      - metric_id
      - note
      - period_start
      - value
    GoalDirectionEnum:
      enum:
      - above
      - below
      - equal
      type: string
      description: |-
        * `above` - At or above the goal
        * `below` - At or below the goal
        * `equal` - Equal to the goal
    Me:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
        organisation:
          $ref: '#/components/schemas/MeOrganisation'
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_organisation_admin:
          type: boolean
        team_ids:
          type: array
          items:
            type: integer
        scopes:
          type: array
          items:
            type: string
          description: The scopes this token carries.
      required:
      - email
      - id
      - is_organisation_admin
      - name
      - organisation
      - role
      - scopes
      - team_ids
      - username
    MeOrganisation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
      required:
      - id
      - name
    Meeting:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        team_id:
          type: integer
        scheduled_date:
          type: string
          format: date
        status:
          $ref: '#/components/schemas/MeetingStatusEnum'
        started_at:
          type:
          - string
          - 'null'
          format: date-time
        ended_at:
          type:
          - string
          - 'null'
          format: date-time
        duration_minutes:
          type:
          - integer
          - 'null'
          description: How long it ran, once it has ended.
        current_position:
          type: integer
          description: The agenda item the meeting has reached.
        agenda:
          type: array
          items:
            $ref: '#/components/schemas/AgendaItem'
          readOnly: true
          description: The agenda as it stood when the meeting was created. Later
            changes to the organisation's agenda do not alter it.
        notes:
          type: array
          items:
            $ref: '#/components/schemas/MeetingNote'
        updates:
          type: array
          items:
            $ref: '#/components/schemas/MeetingUpdate'
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/MeetingRating'
        average_rating:
          type:
          - number
          - 'null'
          format: double
          readOnly: true
        key_messages:
          type: string
          description: What the team agreed to pass on to the rest of the organisation.
        created_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - agenda
      - average_rating
      - created_at
      - created_by
      - current_position
      - duration_minutes
      - id
      - key_messages
      - notes
      - ratings
      - scheduled_date
      - status
      - team_id
      - updates
    MeetingNote:
      type: object
      properties:
        position:
          type: integer
          description: The agenda item the note belongs to.
        text:
          type: string
        updated_by:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        updated_at:
          type: string
          format: date-time
      required:
      - position
      - text
      - updated_at
      - updated_by
    MeetingRating:
      type: object
      properties:
        participant:
          $ref: '#/components/schemas/Person'
        score:
          type: integer
          maximum: 10
          minimum: 1
        note:
          type: string
      required:
      - note
      - participant
      - score
    MeetingStatusEnum:
      enum:
      - scheduled
      - active
      - complete
      type: string
      description: |-
        * `scheduled` - Scheduled
        * `active` - Active
        * `complete` - Complete
    MeetingUpdate:
      type: object
      properties:
        id:
          type: integer
        type:
          $ref: '#/components/schemas/MeetingUpdateTypeEnum'
        text:
          type: string
        author:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        blocker_id:
          type:
          - integer
          - 'null'
          description: The blocker this update was turned into, if any.
        created_at:
          type: string
          format: date-time
      required:
      - author
      - blocker_id
      - created_at
      - id
      - text
      - type
    MeetingUpdateTypeEnum:
      enum:
      - good
      - bad
      type: string
      description: |-
        * `good` - Good news
        * `bad` - Concern
    Metric:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        metrics_board_id:
          type: integer
        name:
          type: string
          maxLength: 255
        owner:
          $ref: '#/components/schemas/Person'
        type:
          $ref: '#/components/schemas/MetricTypeEnum'
        goal_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        goal_direction:
          $ref: '#/components/schemas/GoalDirectionEnum'
        frequency:
          $ref: '#/components/schemas/MetricFrequencyEnum'
        order:
          type: integer
          maximum: 32767
          minimum: 0
        is_active:
          type: boolean
      required:
      - frequency
      - goal_direction
      - goal_value
      - id
      - metrics_board_id
      - name
      - owner
      - type
    MetricFrequencyEnum:
      enum:
      - weekly
      - monthly
      type: string
      description: |-
        * `weekly` - Weekly
        * `monthly` - Monthly
    MetricTypeEnum:
      enum:
      - integer
      - float
      - percentage
      type: string
      description: |-
        * `integer` - Whole number
        * `float` - Decimal number
        * `percentage` - Percentage
    MetricsBoard:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        team_id:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - team_id
      - updated_at
    NullEnum:
      type: 'null'
    OrgChart:
      type: object
      properties:
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/OrgChartNode'
          description: The top of the chart; each node carries its own children.
      required:
      - nodes
    OrgChartNode:
      type: object
      properties:
        id:
          type: integer
        parent_id:
          type:
          - integer
          - 'null'
        name:
          type: string
        type:
          $ref: '#/components/schemas/OrgChartNodeTypeEnum'
        owner:
          oneOf:
          - $ref: '#/components/schemas/Person'
          - type: 'null'
        is_vacant:
          type: boolean
        order:
          type: integer
        responsibilities:
          type: array
          items:
            $ref: '#/components/schemas/Responsibility'
        children:
          type: array
          items:
            $ref: '#/components/schemas/OrgChartNode'
          readOnly: true
          description: The nodes directly beneath this one, in chart order.
      required:
      - children
      - id
      - is_vacant
      - name
      - order
      - owner
      - parent_id
      - responsibilities
      - type
    OrgChartNodeTypeEnum:
      enum:
      - role
      - department
      type: string
      description: |-
        * `role` - Role
        * `department` - Department
    Organisation:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        slug:
          type: string
        branding:
          $ref: '#/components/schemas/Branding'
        vocabulary:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/Term'
          description: What this organisation calls each building block, keyed by
            the fixed API name.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - branding
      - created_at
      - id
      - name
      - slug
      - updated_at
      - vocabulary
    PaginatedActionList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Action'
    PaginatedBlockerList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
            $ref: '#/components/schemas/Blocker'
    PaginatedCheckInList:
      type: object
      required:
      - results
      properties:
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cD00ODY%3D"
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?cursor=cj0xJnA9NDg3
        results:
          type: array
          items:
