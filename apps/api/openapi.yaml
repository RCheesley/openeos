                $ref: '#/components/schemas/Problem'
          description: The token lacks the scope this endpoint needs.
        '404':
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
          description: No such record, or not one the caller may see.
        '429':
          content:
