{% extends "base.html" %}
{% block title %}Password Reset Complete — EOS App{% endblock %}
{% block content %}
<div class="row justify-content-center">

        <i class="bi bi-check-circle display-4 text-success mb-3"></i>

        <a href="{% url 'login' %}" class="btn btn-dark mt-2">Sign in</a>
    </div>
</div>
{% endblock %}
