{% extends "base.html" %}
{% block title %}Set New Password — EOS App{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4">
        <h2 class="h4 mb-4">Set a new password</h2>
        {% if validlink %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="id_new_password1" class="form-label">New password</label>
                <input type="password" name="new_password1" id="id_new_password1" class="form-control" required autofocus>
            </div>
            <div class="mb-4">
                <label for="id_new_password2" class="form-label">Confirm new password</label>
                <input type="password" name="new_password2" id="id_new_password2" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-dark w-100">Set new password</button>
        </form>
        {% else %}
        <div class="alert alert-danger">
            <i class="bi bi-exclamation-circle me-1"></i>
            This password reset link is invalid or has expired.
        </div>
        <a href="{% url 'password_reset' %}" class="btn btn-outline-dark">Request a new link</a>
        {% endif %}
    </div>
</div>
{% endblock %}
