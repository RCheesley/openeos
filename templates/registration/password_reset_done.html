{% extends "base.html" %}
{% block title %}Check Your Email — EOS App{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-4 text-center">
        <i class="bi bi-envelope-check display-4 text-success mb-3"></i>
        <h2 class="h4">Check your email</h2>
        <p class="text-muted">
            We've sent a password reset link to your email address.
            The link expires in 24 hours.
        </p>
        <a href="{% url 'login' %}" class="btn btn-outline-dark mt-2">Back to sign in</a>
    </div>
</div>
{% endblock %}
