{% extends "base.html" %}
{% block title %}{{ action }} Team — EOS App{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-6">
        <div class="mb-4">
            <a href="{% url 'accounts:team_list' %}" class="text-muted text-decoration-none small">
                <i class="bi bi-arrow-left me-1"></i> Teams
            </a>
            <h1 class="h3 mt-2 mb-0">{{ action }} team</h1>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_name" class="form-label fw-semibold">Team name</label>
                        {{ form.name }}
                        {% if form.name.errors %}
                        <div class="text-danger small mt-1">{{ form.name.errors.0 }}</div>
                        {% endif %}
                    </div>
                    <div class="mb-4">
                        <label for="id_description" class="form-label fw-semibold">
                            Description <span class="text-muted fw-normal">(optional)</span>
                        </label>
                        {{ form.description }}
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-dark">
                            <i class="bi bi-check-lg me-1"></i> {{ action }} team
                        </button>
                        <a href="{% url 'accounts:team_list' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
