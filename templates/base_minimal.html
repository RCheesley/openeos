{% load static %}<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{% block page_title %}{% endblock %} — {{ brand.name }}{% endblock %}</title>
    <link href="{% static 'vendor/bootstrap-5.3.3/css/bootstrap.min.css' %}" rel="stylesheet">
    <link href="{% static 'vendor/bootstrap-icons-1.11.3/bootstrap-icons.css' %}" rel="stylesheet">
    {% include "includes/brand_head.html" %}
    <link href="{% static 'css/app.css' %}" rel="stylesheet">
    {% block extra_css %}{% endblock %}
</head>
<body class="bg-light">
{% block content %}{% endblock %}
<script src="{% static 'vendor/bootstrap-5.3.3/js/bootstrap.bundle.min.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
