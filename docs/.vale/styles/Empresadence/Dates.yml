extends: existence
message: "Write dates as '26 November 2026', not '%s'."
link: https://github.com/drikusb/empresadence/blob/main/docs/contributing/style-guide.md
level: warning
nonword: true
tokens:
  - '\b(?:January|February|March|April|May|June|July|August|September|October|November|December) \d{1,2}(?:st|nd|rd|th)?,? \d{4}\b'
  - '\b\d{1,2}(?:st|nd|rd|th) (?:January|February|March|April|May|June|July|August|September|October|November|December)\b'
  - '\b\d{1,2}/\d{1,2}/\d{2,4}\b'
