# Checks every word against a British English dictionary.
# The dictionary files are in docs/.vale/styles/config/dictionaries/.
# Project words that are not in the dictionary go in
# docs/.vale/styles/config/vocabularies/Empresadence/accept.txt.
extends: spelling
message: "'%s' is not in the British English dictionary. Fix the spelling, or add the word to accept.txt if it is a real term."
link: https://github.com/drikusb/empresadence/blob/main/docs/contributing/style-guide.md
level: error
dictionaries:
  - en_GB
